<text x="58" y="348" font-family="monospace" font-size="11" fill="#95A5A6">    |- .gitignore</text>
<text x="350" y="348" font-family="sans-serif" font-size="9" fill="#555555"> [CLI generates]</text>
<rect x="45" y="358" width="6" height="6" rx="1" fill="#95A5A6"/>
<text x="58" y="368" font-family="monospace" font-size="11" fill="#95A5A6">    |- cdk/</text>
<text x="350" y="368" font-family="sans-serif" font-size="9" fill="#555555"> [CLI generates]</text>
<rect x="45" y="378" width="6" height="6" rx="1" fill="#95A5A6"/>
<text x="58" y="388" font-family="monospace" font-size="11" fill="#95A5A6">    |- .cli/</text>
<text x="350" y="388" font-family="sans-serif" font-size="9" fill="#555555"> [CLI generates]</text>
<rect x="45" y="398" width="6" height="6" rx="1" fill="#95A5A6"/>
<text x="58" y="408" font-family="monospace" font-size="11" fill="#95A5A6">    |- .llm-context/</text>
<text x="350" y="408" font-family="sans-serif" font-size="9" fill="#555555"> [CLI generates]</text>
<rect x="45" y="418" width="6" height="6" rx="1" fill="#95A5A6"/>
<text x="58" y="428" font-family="monospace" font-size="11" fill="#95A5A6">    `- .cache/</text>
<text x="350" y="428" font-family="sans-serif" font-size="9" fill="#555555"> [CLI generates]</text>
<text x="340" y="462" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#555555">You never edit gear files. The next command overwrites them.</text>
