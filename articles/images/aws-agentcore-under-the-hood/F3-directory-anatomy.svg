<rect x="45" y="158" width="6" height="6" rx="1" fill="#2E86DE"/>
<text x="58" y="168" font-family="monospace" font-size="11" fill="#2E86DE">    `- pyproject.toml</text>
<text x="350" y="168" font-family="sans-serif" font-size="9" fill="#555555"> [you write]</text>
<rect x="45" y="178" width="6" height="6" rx="1" fill="#2E86DE"/>
<text x="58" y="188" font-family="monospace" font-size="11" fill="#2E86DE">  |- tests/</text>
<text x="350" y="188" font-family="sans-serif" font-size="9" fill="#555555"> [you write]</text>
<rect x="45" y="198" width="6" height="6" rx="1" fill="#2E86DE"/>
<text x="58" y="208" font-family="monospace" font-size="11" fill="#2E86DE">    |- smoke.py</text>
