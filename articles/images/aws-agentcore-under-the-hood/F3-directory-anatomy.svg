<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680">
<rect width="680" height="480" fill="#FFFFFF"/>
<text x="340" y="32" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#1A1A2E">Project Directory: Two Colours</text>
<rect x="470" y="14" width="12" height="12" rx="2" fill="#2E86DE"/><text x="488" y="25" font-family="sans-serif" font-size="10" fill="#555555">you write</text>
<rect x="560" y="14" width="12" height="12" rx="2" fill="#95A5A6"/><text x="578" y="25" font-family="sans-serif" font-size="10" fill="#555555">CLI generates</text>
<text x="58" y="68" font-family="monospace" font-size="11" fill="#1A1A2E">|- 01-first-agent/</text>
<rect x="45" y="78" width="6" height="6" rx="1" fill="#2E86DE"/>
<text x="58" y="88" font-family="monospace" font-size="11" fill="#2E86DE">  |- src/</text>
<text x="350" y="88" font-family="sans-serif" font-size="9" fill="#555555"> [you write]</text>
<rect x="45" y="98" width="6" height="6" rx="1" fill="#2E86DE"/>
<text x="58" y="108" font-family="monospace" font-size="11" fill="#2E86DE">    |- main.py</text>
<text x="350" y="108" font-family="sans-serif" font-size="9" fill="#555555"> [you write]</text>
<rect x="45" y="118" width="6" height="6" rx="1" fill="#2E86DE"/>
<text x="58" y="128" font-family="monospace" font-size="11" fill="#2E86DE">    |- model/load.py</text>
<text x="350" y="128" font-family="sans-serif" font-size="9" fill="#555555"> [you write]</text>
<rect x="45" y="138" width="6" height="6" rx="1" fill="#2E86DE"/>
<text x="58" y="148" font-family="monospace" font-size="11" fill="#2E86DE">    |- model/sanitize.py</text>
