<text x="350" y="268" font-family="sans-serif" font-size="9" fill="#555555"> [you write]</text>
<text x="58" y="288" font-family="monospace" font-size="11" fill="#1A1A2E">  `- agentcore/</text>
<rect x="45" y="298" width="6" height="6" rx="1" fill="#2E86DE"/>
<text x="58" y="308" font-family="monospace" font-size="11" fill="#2E86DE">    |- agentcore.json</text>
