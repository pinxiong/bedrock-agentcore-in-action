<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680">
<rect width="680" height="260" fill="#FFFFFF"/>
<text x="340" y="32" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#1A1A2E">Deploy: Six Steps to READY</text>
<rect x="46" y="70" width="88" height="120" rx="8" fill="#D6EAF8" stroke="#2E86DE" stroke-width="2"/>
<circle cx="90" cy="92" r="14" fill="#2E86DE"/><text x="90" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="white">1</text>
<text x="90" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2E86DE">Package</text>
<text x="90" y="142" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555555">zip src/ + deps</text>
<text x="90" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555555">41 MB asset</text>
<text x="90" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#555555">seconds</text>
<line x1="136" y1="130" x2="144" y2="130" stroke="#BDC3C7" stroke-width="2" marker-end=""/>
<rect x="146" y="70" width="88" height="120" rx="8" fill="#F4ECF7" stroke="#8E44AD" stroke-width="2"/>
<circle cx="190" cy="92" r="14" fill="#8E44AD"/><text x="190" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="white">2</text>
<text x="190" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#8E44AD">Synthesize</text>
<text x="190" y="142" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555555">CDK app reads JSON</text>
<text x="190" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555555">emits CFN template</text>
<text x="190" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#555555">~3s</text>
<line x1="236" y1="130" x2="244" y2="130" stroke="#BDC3C7" stroke-width="2" marker-end=""/>
<rect x="246" y="70" width="88" height="120" rx="8" fill="#FFF3E0" stroke="#FF8C00" stroke-width="2"/>
<circle cx="290" cy="92" r="14" fill="#FF8C00"/><text x="290" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="white">3</text>
<text x="290" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FF8C00">Upload</text>
<text x="290" y="142" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555555">zip -> S3</text>
<text x="290" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555555">(bootstrapped bucket)</text>
<text x="290" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#555555">seconds</text>
<line x1="336" y1="130" x2="344" y2="130" stroke="#BDC3C7" stroke-width="2" marker-end=""/>
<rect x="346" y="70" width="88" height="120" rx="8" fill="#FFF3E0" stroke="#FF8C00" stroke-width="2"/>
<circle cx="390" cy="92" r="14" fill="#FF8C00"/><text x="390" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="white">4</text>
<text x="390" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FF8C00">Create stack</text>
<text x="390" y="142" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555555">CloudFormation</text>
<text x="390" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555555">4 resources</text>
<text x="390" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#555555">~5min (cold)</text>
<line x1="436" y1="130" x2="444" y2="130" stroke="#BDC3C7" stroke-width="2" marker-end=""/>
<rect x="446" y="70" width="88" height="120" rx="8" fill="#ECF0F1" stroke="#95A5A6" stroke-width="2"/>
<circle cx="490" cy="92" r="14" fill="#95A5A6"/><text x="490" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="white">5</text>
<text x="490" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#95A5A6">Record state</text>
<text x="490" y="142" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555555">deployed-state.json</text>
<text x="490" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555555">ARN + endpoint</text>
<text x="490" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#555555">instant</text>
<line x1="536" y1="130" x2="544" y2="130" stroke="#BDC3C7" stroke-width="2" marker-end=""/>
<rect x="546" y="70" width="88" height="120" rx="8" fill="#D5F5E3" stroke="#27AE60" stroke-width="2"/>
<circle cx="590" cy="92" r="14" fill="#27AE60"/><text x="590" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="white">6</text>
<text x="590" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#27AE60">Print endpoint</text>
<text x="590" y="142" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555555">Runtime: READY</text>
<text x="590" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#555555">instant</text>
<text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Cold deploy: 9 min 49 s  |  Code-only redeploy: 26 s</text>
<text x="340" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#555555">Stack name = AgentCore-&lt;projectName&gt;-&lt;targetName&gt; (from JSON, never hardcoded)</text>
</svg>