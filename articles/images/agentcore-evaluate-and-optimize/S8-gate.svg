<text x="58" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ agentcore run batch-evaluation --runtime aia_uc06 -e Builtin.Correctness \</text>
