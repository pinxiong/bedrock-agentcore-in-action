<text x="58" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ aws agent-registry-control submit-registry-record-for-approval --region us-east-1 \</text>
