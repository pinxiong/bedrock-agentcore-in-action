<text x="753" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7c93b5" text-anchor="middle">terminal - the catalog is created with the aws CLI, not by the CLI contract</text>
<text x="58" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ aws agent-registry-control create-registry --region us-east-1 \</text>
<text x="58" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --name aia-uc07-catalog \</text>
<text x="58" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --description &quot;Legal and compliance workflow-automation agents: contract review ...&quot; \</text>
<text x="58" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --discovery-configuration authorizerType=AWS_IAM \</text>
<text x="58" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --tags Project=agentcore-in-action,UseCase=07,AutoDelete=true</text>
<text x="58" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#7dd3fc" xml:space="preserve">    &quot;registryArn&quot;: &quot;arn:aws:agent-registry:us-east-1:123456789012:registry/niFvetsCk7ujKrAO&quot;</text>
<text x="58" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ aws agent-registry-control create-registry-record --region us-east-1 \</text>
<text x="58" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --registry-id niFvetsCk7ujKrAO --name billing --record-type MCP \</text>
<text x="58" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --descriptors &#x27;{&quot;mcpServer&quot;:{&quot;data&quot;:&quot;{\&quot;name\&quot;: \&quot;dev.xiongpin/billing\&quot;, ...}&quot;,&quot;dataSchemaVersion&quot;:&quot;2025-12-11&quot;}}&#x27; \</text>
<text x="58" y="345" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --tags Project=agentcore-in-action,UseCase=07,AutoDelete=true</text>
<text x="58" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#f8fafc" xml:space="preserve">    &quot;recordArn&quot;: &quot;arn:aws:agent-registry:us-east-1:123456789012:registry/niFvetsCk7ujKrAO/record/5nMCxyY06tFl&quot;   &quot;status&quot;: &quot;CREATING&quot;</text>
<text x="58" y="399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ aws agent-registry-control create-registry-record --region us-east-1 \</text>
<text x="58" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --registry-id niFvetsCk7ujKrAO --name contract-clause-legal-specialist --record-type AGENT \</text>
<text x="58" y="453" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --descriptors &#x27;{&quot;a2aAgentCard&quot;:{&quot;data&quot;:&quot;{\&quot;name\&quot;: \&quot;aia_uc07_legal\&quot;, ...}&quot;,&quot;dataSchemaVersion&quot;:&quot;0.3&quot;}}&#x27; \</text>
<text x="58" y="480" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --tags Project=agentcore-in-action,UseCase=07,AutoDelete=true</text>
<text x="58" y="507" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#f8fafc" xml:space="preserve">    &quot;recordArn&quot;: &quot;arn:aws:agent-registry:us-east-1:123456789012:registry/niFvetsCk7ujKrAO/record/YRLG41zg45lV&quot;   &quot;status&quot;: &quot;CREATING&quot;</text>
<text x="58" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#7c93b5" xml:space="preserve"># one record per capability: an MCP server document and an A2A agent card</text>
