<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 434" width="1440" height="434" role="img">
<title>terminal - the same session, before and after the mid-session model switch</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
<radialGradient id="g1" cx="0.08" cy="0.02" r="0.8"><stop offset="0" stop-color="#2563eb" stop-opacity="0.22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.92" cy="1.0" r="0.8"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.20"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1440" height="434" fill="url(#bg)"/>
<rect width="1440" height="434" fill="url(#g1)"/>
<rect width="1440" height="434" fill="url(#g2)"/>
<rect x="28" y="26" width="1384" height="382" rx="16" fill="#0b1428" stroke="#1e2a44" stroke-width="1.5"/>
<rect x="28" y="26" width="1384" height="46" rx="16" fill="#101b33"/>
<rect x="28" y="58" width="1384" height="14" fill="#101b33"/>
<circle cx="56" cy="49" r="6.5" fill="#e11d48" opacity="0.85"/>
<circle cx="82" cy="49" r="6.5" fill="#ea580c" opacity="0.85"/>
<circle cx="108" cy="49" r="6.5" fill="#059669" opacity="0.85"/>
<text x="720" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7c93b5" text-anchor="middle">terminal - the same session, before and after the mid-session model switch</text>
<text x="58" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ agentcore invoke --session-id research-session-0004-artifacts-run \</text>
<text x="58" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --prompt &quot;Before we switch anything: which country had the smallest wind share...&quot;</text>
<text x="58" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#f8fafc" xml:space="preserve">India had the smallest wind share in the table at 5.1%.</text>
<text x="58" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve"># edit app/research/harness.json: modelId deepseek.v3.2 -&gt; amazon.nova-lite-v1:0</text>
<text x="58" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ agentcore deploy -y --target default        # 1 m 40 s, harness version 5</text>
<text x="58" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ agentcore invoke --session-id research-session-0004-artifacts-run \</text>
<text x="58" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --prompt &quot;Same session, new model. From the table you built earlier...&quot;</text>
<text x="58" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#f8fafc" xml:space="preserve">India had the smallest wind share at 5.1%. The files created were `wind.xlsx` (1,806 bytes) and `wind.png`</text>
<text x="58" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#f8fafc" xml:space="preserve">        (16,705 bytes).</text>
<text x="58" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7c93b5">evidence/30, 31, 32 · both answers name India at 5.1%, one harness version apart</text>
</svg>
