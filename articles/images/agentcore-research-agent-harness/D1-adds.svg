<rect x="28" y="26" width="1384" height="436" rx="16" fill="#0b1428" stroke="#1e2a44" stroke-width="1.5"/>
<rect x="28" y="26" width="1384" height="46" rx="16" fill="#101b33"/>
<rect x="28" y="58" width="1384" height="14" fill="#101b33"/>
<circle cx="56" cy="49" r="6.5" fill="#e11d48" opacity="0.85"/>
<circle cx="82" cy="49" r="6.5" fill="#ea580c" opacity="0.85"/>
<circle cx="108" cy="49" r="6.5" fill="#059669" opacity="0.85"/>
<text x="720" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7c93b5" text-anchor="middle">terminal - the gateway, the web-search connector, the harness</text>
<text x="58" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ agentcore add gateway --name research-gateway --protocol-type MCP --authorizer-type NONE</text>
<text x="58" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#f8fafc" xml:space="preserve">Added gateway &#x27;research-gateway&#x27;</text>
<text x="58" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ agentcore add gateway-target --name websearch --gateway research-gateway \</text>
<text x="58" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --type connector --connector web-search</text>
<text x="58" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#f8fafc" xml:space="preserve">Added web-search gateway target &#x27;websearch&#x27; on &#x27;research-gateway&#x27;</text>
<text x="58" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ agentcore add harness --name research --model-provider bedrock \</text>
<text x="58" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --model-id deepseek.v3.2 --api-format converse_stream \</text>
<text x="58" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --tools agentcore_browser,agentcore_code_interpreter \</text>
<text x="58" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --system-prompt &quot;You are a market research analyst...&quot; \</text>
<text x="58" y="345" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --max-iterations 30 --timeout 900</text>
<text x="58" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#f8fafc" xml:space="preserve">Added harness &#x27;research&#x27;.</text>
<text x="58" y="407" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7c93b5">evidence/10, 11, 12 · web search is a gateway connector; the harness carries browser and code interpreter</text>
</svg>
