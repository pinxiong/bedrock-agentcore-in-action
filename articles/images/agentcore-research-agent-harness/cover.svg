<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>A research agent in AgentCore: one prompt, three managed tools, two real files</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
<radialGradient id="g1" cx="0.08" cy="0.02" r="0.8"><stop offset="0" stop-color="#2563eb" stop-opacity="0.22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.92" cy="1.0" r="0.8"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.20"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect width="1200" height="675" fill="url(#g1)"/>
<rect width="1200" height="675" fill="url(#g2)"/>
<text x="66" y="101" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="29" fill="#60a5fa" font-weight="600">AgentCore in Action</text>
<text x="66" y="189" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="62" fill="#f8fafc" font-weight="700">The Managed Harness</text>
<text x="66" y="246" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#c4b5fd">one prompt, three tools, two files, no agent loop written</text>
<rect x="66" y="317" width="295" height="189" rx="14" fill="#0b1428" stroke="#3b82f6" stroke-width="2"/>
<text x="214" y="382" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#3b82f6" font-weight="600" text-anchor="middle">one prompt</text>
<text x="214" y="416" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">search, browse,</text>
<text x="214" y="450" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">compute</text>
<rect x="452" y="317" width="295" height="189" rx="14" fill="#0b1428" stroke="#7c3aed" stroke-width="2"/>
<text x="600" y="382" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#7c3aed" font-weight="600" text-anchor="middle">managed harness</text>
<text x="600" y="416" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">harness.json + tools</text>
<text x="600" y="450" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">session state per id</text>
<rect x="838" y="317" width="295" height="189" rx="14" fill="#0b1428" stroke="#059669" stroke-width="2"/>
<text x="986" y="382" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#059669" font-weight="600" text-anchor="middle">session VM</text>
<text x="986" y="416" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">wind.xlsx 1,806 B</text>
<text x="986" y="450" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">wind.png 16,705 B</text>
<line x1="361.00" y1="411.00" x2="444.85" y2="411.00" stroke="#60a5fa" stroke-width="2.2"/>
<polygon points="439.00,404.50 452.00,411.00 439.00,417.50" fill="#60a5fa"/>
<text x="406" y="397" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#60a5fa" text-anchor="middle">invoke</text>
<line x1="747.00" y1="411.00" x2="830.85" y2="411.00" stroke="#34d399" stroke-width="2.2"/>
<polygon points="825.00,404.50 838.00,411.00 825.00,417.50" fill="#34d399"/>
<text x="792" y="397" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#34d399" text-anchor="middle">tools</text>
<text x="66" y="608" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#8ea0bd">one invoke, 22 tool spans, two real files; the model switches mid-session and the session survives</text>
</svg>
