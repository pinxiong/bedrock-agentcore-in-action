<text x="960" y="397" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#059669" font-weight="600" text-anchor="middle">session VM</text>
<text x="960" y="431" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">wind.xlsx 1,806 B</text>
<text x="960" y="465" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">wind.png 16,705 B</text>
<line x1="282.00" y1="426.00" x2="382.85" y2="426.00" stroke="#60a5fa" stroke-width="2.2" opacity="0.9"/>
