<text x="546" y="431" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">harness.json + tools</text>
<text x="546" y="465" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">session state per id</text>
