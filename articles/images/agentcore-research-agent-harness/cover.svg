<text x="174" y="397" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#7c93b5" font-weight="600" text-anchor="middle">one prompt</text>
<text x="174" y="431" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">search, browse,</text>
<text x="174" y="465" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cbd5e1" font-weight="400" text-anchor="middle">compute</text>
