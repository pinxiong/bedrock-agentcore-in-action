<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="1440" height="760" role="img">
<title>One prompt reaches the managed harness, which drives web search through the gateway, pages through the browser and computes in the code interpreter; the files stay in the session VM until exec fetches them.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
<radialGradient id="g1" cx="0.08" cy="0.02" r="0.8"><stop offset="0" stop-color="#2563eb" stop-opacity="0.22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.92" cy="1.0" r="0.8"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.20"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1440" height="760" fill="url(#bg)"/>
<rect width="1440" height="760" fill="url(#g1)"/>
<rect width="1440" height="760" fill="url(#g2)"/>
<text x="60" y="62" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#f8fafc" text-anchor="start" font-weight="600">the deployed use case, uc05</text>
<text x="60" y="90" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400">one prompt reaches the harness, the harness calls three managed tools, the files stay in the session VM</text>
<rect x="60" y="270" width="240" height="110" rx="14" fill="#0e1a33" stroke="#2b3c5e" stroke-width="2"/>
<text x="180" y="318" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#f8fafc" font-weight="600" text-anchor="middle">one prompt</text>
<text x="180" y="344" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7c93b5" font-weight="400" text-anchor="middle">agentcore invoke</text>
<rect x="380" y="225" width="340" height="200" rx="14" fill="#122146" stroke="#3b82f6" stroke-width="2"/>
<text x="550" y="292" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#f8fafc" font-weight="600" text-anchor="middle">managed harness</text>
<text x="550" y="318" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7c93b5" font-weight="400" text-anchor="middle">harness.json: model, prompt,</text>
<text x="550" y="344" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7c93b5" font-weight="400" text-anchor="middle">max-iterations, tool list</text>
<text x="550" y="370" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c4b5fd" font-weight="400" text-anchor="middle">session VM per session id</text>
<rect x="900" y="160" width="340" height="100" rx="14" fill="#0d1729" stroke="#0d9488" stroke-width="2"/>
<text x="1070" y="203" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#5eead4" font-weight="600" text-anchor="middle">browser tool</text>
<text x="1070" y="229" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7c93b5" font-weight="400" text-anchor="middle">StartBrowserSession, pages</text>
<rect x="900" y="300" width="340" height="110" rx="14" fill="#122146" stroke="#7c3aed" stroke-width="2"/>
<text x="1070" y="335" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#e9d5ff" font-weight="600" text-anchor="middle">gateway · web-search</text>
<text x="1070" y="361" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7c93b5" font-weight="400" text-anchor="middle">connector target</text>
<text x="1070" y="387" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c4b5fd" font-weight="400" text-anchor="middle">managed web index</text>
<rect x="900" y="450" width="340" height="110" rx="14" fill="#0d1729" stroke="#ea580c" stroke-width="2"/>
<text x="1070" y="485" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#fdba74" font-weight="600" text-anchor="middle">code interpreter</text>
<text x="1070" y="511" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7c93b5" font-weight="400" text-anchor="middle">sandbox: stdlib + PIL, numpy</text>
<text x="1070" y="537" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#fdba74" font-weight="400" text-anchor="middle">wind.xlsx + wind.png</text>
