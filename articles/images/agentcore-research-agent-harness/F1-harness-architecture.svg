<polygon points="885.00,217.00 900.00,210.00 885.00,203.00" fill="#60a5fa"/>
<text x="855.0" y="199.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="400">browse</text>
<line x1="810.00" y1="355.00" x2="891.75" y2="355.00" stroke="#60a5fa" stroke-width="2.2"/>
