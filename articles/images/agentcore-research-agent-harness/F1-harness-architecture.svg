<line x1="810.00" y1="505.00" x2="891.75" y2="505.00" stroke="#60a5fa" stroke-width="2.2"/>
<polygon points="885.00,512.00 900.00,505.00 885.00,498.00" fill="#60a5fa"/>
<text x="855.0" y="494.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="400">code</text>
<line x1="1070.00" y1="560.00" x2="1070.00" y2="601.75" stroke="#fdba74" stroke-width="2.2"/>
<polygon points="1063.00,595.00 1070.00,610.00 1077.00,595.00" fill="#fdba74"/>
<text x="1084.0" y="590.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400">files land in /home</text>
