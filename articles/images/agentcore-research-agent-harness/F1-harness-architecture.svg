<text x="1070" y="640" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#f8fafc" font-weight="600" text-anchor="middle">session VM</text>
<text x="1070" y="666" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7c93b5" font-weight="400" text-anchor="middle">agentcore exec pins the id</text>
<text x="1070" y="692" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#34d399" font-weight="400" text-anchor="middle">ls · base64 out</text>
<line x1="300.00" y1="325.00" x2="371.75" y2="325.00" stroke="#60a5fa" stroke-width="2.2"/>
<polygon points="365.00,332.00 380.00,325.00 365.00,318.00" fill="#60a5fa"/>
