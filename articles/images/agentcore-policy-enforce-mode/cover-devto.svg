<polygon points="364.17,258.58 375.00,264.00 364.17,269.42" fill="#60a5fa"/>
<text x="335" y="252" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8ea0bd" text-anchor="middle">tools/call</text>
<line x1="655.00" y1="264.00" x2="729.04" y2="264.00" stroke="#34d399" stroke-width="2.2"/>
