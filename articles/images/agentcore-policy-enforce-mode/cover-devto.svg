<rect width="1000" height="420" fill="url(#bg)"/>
<rect width="1000" height="420" fill="url(#g1)"/>
<rect width="1000" height="420" fill="url(#g2)"/>
<text x="55" y="63" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" fill="#60a5fa" font-weight="600">AgentCore in Action</text>
<text x="55" y="118" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="52" fill="#f8fafc" font-weight="700">Policy in AgentCore</text>
<text x="55" y="153" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#c4b5fd">A ceiling the model cannot argue with</text>
<rect x="55" y="210" width="240" height="109" rx="14" fill="#0b1428" stroke="#3b82f6" stroke-width="2"/>
<text x="175" y="247" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#3b82f6" font-weight="600" text-anchor="middle">agent</text>
<text x="175" y="268" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="middle">asks for</text>
<text x="175" y="289" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="middle">CNY 3000</text>
