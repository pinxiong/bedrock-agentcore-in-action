<text x="720" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7c93b5" text-anchor="middle">terminal - the engine, then two Cedar policies written from natural language</text>
<text x="58" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ agentcore add policy-engine --name refundPolicyEngine --attach-to-gateways refund-gateway \</text>
<text x="58" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --attach-mode LOG_ONLY --json</text>
<text x="58" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#f8fafc" xml:space="preserve">{&quot;success&quot;:true,&quot;engineName&quot;:&quot;refundPolicyEngine&quot;}</text>
<text x="58" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ agentcore add policy --name refundCeiling --engine refundPolicyEngine \</text>
<text x="58" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    -g &quot;permit a processRefund tool call only when its amount argument is less than or equal to 500&quot; \</text>
<text x="58" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --gateway refund-gateway --target refund --json</text>
<text x="58" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#34d399" xml:space="preserve">{&quot;success&quot;:true,&quot;policyName&quot;:&quot;refundCeiling&quot;,&quot;engineName&quot;:&quot;refundPolicyEngine&quot;}</text>
<text x="58" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ agentcore add policy --name approvalAlways --engine refundPolicyEngine \</text>
<text x="58" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    -g &quot;permit an approveRefund tool call only when its orderId argument is a non-empty string&quot; \</text>
<text x="58" y="345" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">    --gateway refund-gateway --target refund --json</text>
<text x="58" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#34d399" xml:space="preserve">{&quot;success&quot;:true,&quot;policyName&quot;:&quot;approvalAlways&quot;,&quot;engineName&quot;:&quot;refundPolicyEngine&quot;}</text>
<text x="58" y="407" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7c93b5">evidence/20, 21, 21b · natural language in, Cedar in the contract out; deploy puts the engine online</text>
