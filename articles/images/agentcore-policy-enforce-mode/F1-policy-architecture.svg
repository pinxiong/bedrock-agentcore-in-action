<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" width="1440" height="700" role="img">
<title>The model proposes a refund, the policy engine attached to the gateway decides before the backend ever runs.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
<radialGradient id="g1" cx="0.08" cy="0.02" r="0.8"><stop offset="0" stop-color="#2563eb" stop-opacity="0.22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.92" cy="1.0" r="0.8"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.20"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1440" height="700" fill="url(#bg)"/>
<rect width="1440" height="700" fill="url(#g1)"/>
<rect width="1440" height="700" fill="url(#g2)"/>
<text x="60" y="62" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#f8fafc" text-anchor="start" font-weight="600">the deployed use case, uc04</text>
<text x="60" y="90" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400">the ceiling lives in Cedar on the engine, not in the prompt the model reads</text>
<rect x="60" y="240" width="240" height="120" rx="14" fill="#0e1a33" stroke="#2b3c5e" stroke-width="2"/>
<text x="180" y="293" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#f8fafc" font-weight="600" text-anchor="middle">customer / rep</text>
<text x="180" y="319" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7c93b5" font-weight="400" text-anchor="middle">agentcore invoke</text>
<rect x="386" y="225" width="300" height="150" rx="14" fill="#122146" stroke="#3b82f6" stroke-width="2"/>
<text x="536" y="280" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#f8fafc" font-weight="600" text-anchor="middle">AgentCore Runtime</text>
<text x="536" y="306" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7c93b5" font-weight="400" text-anchor="middle">aia_uc04 · Strands · deepseek.v3.2</text>
<text x="536" y="332" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#fda4af" font-weight="400" text-anchor="middle">no rule in the prompt</text>
<rect x="773" y="40" width="300" height="104" rx="14" fill="#0d1729" stroke="#7c3aed" stroke-width="2"/>
<text x="923" y="85" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#e9d5ff" font-weight="600" text-anchor="middle">policy engine · 2 Cedar policies</text>
<text x="923" y="111" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7c93b5" font-weight="400" text-anchor="middle">amount &lt;= 500, otherwise default deny</text>
<rect x="773" y="200" width="300" height="200" rx="14" fill="#122146" stroke="#7c3aed" stroke-width="2"/>
<text x="923" y="267" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#e9d5ff" font-weight="600" text-anchor="middle">AgentCore Gateway</text>
<text x="923" y="293" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7c93b5" font-weight="400" text-anchor="middle">MCP endpoint</text>
<text x="923" y="319" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c4b5fd" font-weight="400" text-anchor="middle">mode: LOG_ONLY | ENFORCE</text>
<text x="923" y="345" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c4b5fd" font-weight="400" text-anchor="middle">decision logged either way</text>
<rect x="1160" y="245" width="220" height="130" rx="14" fill="#0e1a33" stroke="#2b3c5e" stroke-width="2"/>
<text x="1270" y="290" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#f8fafc" font-weight="600" text-anchor="middle">aia-uc04-refund</text>
<text x="1270" y="316" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7c93b5" font-weight="400" text-anchor="middle">approveRefund</text>
<text x="1270" y="342" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7c93b5" font-weight="400" text-anchor="middle">processRefund</text>
<rect x="773" y="480" width="300" height="120" rx="14" fill="#0d1729" stroke="#0d9488" stroke-width="2"/>
<text x="923" y="520" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#5eead4" font-weight="600" text-anchor="middle">decision log</text>
<text x="923" y="546" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7c93b5" font-weight="400" text-anchor="middle">decision, reason,</text>
<text x="923" y="572" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7c93b5" font-weight="400" text-anchor="middle">determiningPolicies[]</text>
