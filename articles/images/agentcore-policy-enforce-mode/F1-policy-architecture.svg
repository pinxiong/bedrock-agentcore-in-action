<line x1="686.00" y1="300.00" x2="764.75" y2="300.00" stroke="#60a5fa" stroke-width="2.2"/>
<polygon points="758.00,307.00 773.00,300.00 758.00,293.00" fill="#60a5fa"/>
<text x="729.5" y="292.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400">tools/call</text>
<line x1="923.00" y1="200.00" x2="923.00" y2="152.25" stroke="#c4b5fd" stroke-width="2.2"/>
<polygon points="930.00,159.00 923.00,144.00 916.00,159.00" fill="#c4b5fd"/>
<text x="935.0" y="177.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">authorize</text>
<line x1="923.00" y1="400.00" x2="923.00" y2="471.75" stroke="#5eead4" stroke-width="2.2"/>
<polygon points="916.00,465.00 923.00,480.00 930.00,465.00" fill="#5eead4"/>
<text x="911.0" y="445.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="end" font-weight="400">every call</text>
<path d="M 1073 250 C 1093 302, 1102 310, 1160 310" stroke="#34d399" stroke-width="2.4" fill="none"/>
<polygon points="1145.00,317.00 1160.00,310.00 1145.00,303.00" fill="#34d399"/>
<text x="1081" y="236.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#34d399" text-anchor="start" font-weight="400">amount &lt;= 500 -&gt; ALLOW</text>
<line x1="1073" y1="344" x2="1148" y2="428" stroke="#fda4af" stroke-width="2.4"/>
<path d="M 1139 418 L 1157 436 M 1139 436 L 1157 418" stroke="#fda4af" stroke-width="3.4" stroke-linecap="round" fill="none"/>
<text x="1148" y="457.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#fda4af" text-anchor="middle" font-weight="400">amount = 3000 -&gt; DENY (-32002)</text>
</svg>
