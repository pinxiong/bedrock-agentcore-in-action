<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680">
<rect width="680" height="372" fill="white"/>

<defs>
  <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="2.5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.15"/>
  </filter>
  <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/>
  </linearGradient>
  <linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6D28D9"/>
  </linearGradient>
  <linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF9900"/><stop offset="1" stop-color="#EA580C"/>
  </linearGradient>
  <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#047857"/>
  </linearGradient>
  <linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F43F5E"/><stop offset="1" stop-color="#BE123C"/>
  </linearGradient>
  <linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#0F766E"/>
  </linearGradient>
  <linearGradient id="g-ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#1E3A8A"/>
  </linearGradient>
  <linearGradient id="g-ribbon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2563EB"/><stop offset="0.35" stop-color="#0D9488"/>
    <stop offset="0.65" stop-color="#EA580C"/><stop offset="1" stop-color="#E11D48"/>
  </linearGradient>
</defs>

<rect x="40" y="24" width="106" height="21" rx="10.5" fill="#4F46E5"/>
<text x="93" y="38.5" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="white">COMMAND MAP</text>
<text x="40" y="80" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="23" font-weight="800" fill="#0F172A">The Whole Lifecycle in Six Commands</text>
<text x="40" y="102" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="12.5" fill="#475569">Everything the AgentCore CLI does, end to end. No --region flag anywhere.</text>
<rect x="50" y="178" width="580" height="8" rx="4" fill="url(#g-ribbon)" opacity="0.25"/>
<rect x="50" y="180" width="580" height="4" rx="2" fill="url(#g-ribbon)"/>
<circle cx="70" cy="182" r="17" fill="url(#g-blue)" filter="url(#ds)"/>
<text x="70" y="187" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="800" fill="white">1</text>
<text x="70" y="211" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B">agentcore</text>
<rect x="36" y="216" width="68" height="21" rx="6" fill="white" stroke="#2563EB" stroke-width="1.5"/>
<text x="70" y="231" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#2563EB">create</text>
<text x="70" y="258" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#0F172A">scaffold the project</text>
<text x="70" y="272" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9.5" fill="#64748B">agentcore.json: every</text>
<text x="70" y="284" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9.5" fill="#64748B">resource array empty</text>
<circle cx="178" cy="182" r="17" fill="url(#g-teal)" filter="url(#ds)"/>
<text x="178" y="187" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="800" fill="white">2</text>
<text x="178" y="211" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B">agentcore</text>
<rect x="157" y="216" width="42" height="21" rx="6" fill="white" stroke="#0D9488" stroke-width="1.5"/>
<text x="178" y="231" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0D9488">dev</text>
<text x="178" y="258" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#0F172A">run it locally</text>
<text x="178" y="272" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9.5" fill="#64748B">Uvicorn on :8080,</text>
<text x="178" y="284" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9.5" fill="#64748B">hot reload</text>
<circle cx="286" cy="182" r="17" fill="url(#g-orange)" filter="url(#ds)"/>
<text x="286" y="187" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="800" fill="white">3</text>
<text x="286" y="211" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B">agentcore</text>
<rect x="252" y="216" width="68" height="21" rx="6" fill="white" stroke="#EA580C" stroke-width="1.5"/>
<text x="286" y="231" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#EA580C">deploy</text>
<text x="286" y="258" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#0F172A">ship it to AWS</text>
<text x="286" y="272" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9.5" fill="#64748B">JSON in, 4 CFN</text>
<text x="286" y="284" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9.5" fill="#64748B">resources out</text>
<circle cx="394" cy="182" r="17" fill="url(#g-green)" filter="url(#ds)"/>
<text x="394" y="187" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="800" fill="white">4</text>
<text x="394" y="211" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B">agentcore</text>
<rect x="360" y="216" width="68" height="21" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
<text x="394" y="231" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#059669">invoke</text>
<text x="394" y="258" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#0F172A">call the runtime</text>
<text x="394" y="272" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9.5" fill="#64748B">SSE stream, native</text>
<text x="394" y="284" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9.5" fill="#64748B">toolUse blocks</text>
<circle cx="502" cy="182" r="17" fill="url(#g-purple)" filter="url(#ds)"/>
<text x="502" y="187" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="800" fill="white">5</text>
<text x="502" y="211" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B">agentcore</text>
<rect x="468" y="216" width="68" height="21" rx="6" fill="white" stroke="#7C3AED" stroke-width="1.5"/>
<text x="502" y="231" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#7C3AED">traces</text>
<text x="502" y="258" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#0F172A">read what happened</text>
<text x="502" y="272" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9.5" fill="#64748B">spans land in X-Ray</text>
<text x="502" y="284" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9.5" fill="#64748B">(~10 min delay)</text>
<circle cx="610" cy="182" r="17" fill="url(#g-red)" filter="url(#ds)"/>
<text x="610" y="187" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="800" fill="white">6</text>
<text x="610" y="211" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B">agentcore</text>
<rect x="576" y="216" width="68" height="21" rx="6" fill="white" stroke="#E11D48" stroke-width="1.5"/>
<text x="610" y="231" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#E11D48">remove</text>
<text x="610" y="258" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#0F172A">tear it all down</text>
<text x="610" y="272" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9.5" fill="#64748B">stack converges</text>
<text x="610" y="284" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9.5" fill="#64748B">to empty</text>
<rect x="20" y="312" width="640" height="44" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" filter="url(#ds)"/>
<text x="340.0" y="331" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Where does it deploy? aws-targets.json decides.</text>
<text x="340.0" y="347" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10" fill="#475569">The first deploy calls STS, learns your account and writes the target back into the file.</text>
</svg>