<rect x="132" y="126" width="98" height="116" rx="12" fill="white" stroke="#7C3AED" stroke-width="2" filter="url(#ds)"/>
<circle cx="181.0" cy="152" r="15" fill="url(#g-purple)"/>
<text x="181.0" y="157" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="12" font-weight="800" fill="white">2</text>
<text x="181.0" y="184" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#7C3AED">Synthesize</text>
<text x="181.0" y="203" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" fill="#475569">CDK reads JSON,</text>
<text x="181.0" y="216" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" fill="#475569">emits CFN template</text>
<path d="M 231 179.0 L 237 184.0 L 231 189.0 Z" fill="#64748B"/>
<rect x="238" y="126" width="98" height="116" rx="12" fill="white" stroke="#0D9488" stroke-width="2" filter="url(#ds)"/>
<circle cx="287.0" cy="152" r="15" fill="url(#g-teal)"/>
<text x="287.0" y="157" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="12" font-weight="800" fill="white">3</text>
<text x="287.0" y="184" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#0D9488">Upload</text>
<text x="287.0" y="203" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" fill="#475569">asset goes to the</text>
<text x="287.0" y="216" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" fill="#475569">bootstrap S3 bucket</text>
<path d="M 337 179.0 L 343 184.0 L 337 189.0 Z" fill="#64748B"/>
<rect x="344" y="126" width="98" height="116" rx="12" fill="white" stroke="#EA580C" stroke-width="2" filter="url(#ds)"/>
<circle cx="393.0" cy="152" r="15" fill="url(#g-orange)"/>
<text x="393.0" y="157" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="12" font-weight="800" fill="white">4</text>
<text x="393.0" y="184" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#EA580C">Create stack</text>
<text x="393.0" y="203" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" fill="#475569">CloudFormation</text>
<text x="393.0" y="216" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" fill="#475569">provisions 4 resources</text>
<path d="M 443 179.0 L 449 184.0 L 443 189.0 Z" fill="#64748B"/>
<rect x="450" y="126" width="98" height="116" rx="12" fill="white" stroke="#7C3AED" stroke-width="2" filter="url(#ds)"/>
<circle cx="499.0" cy="152" r="15" fill="url(#g-purple)"/>
<text x="499.0" y="157" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="12" font-weight="800" fill="white">5</text>
<text x="499.0" y="184" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#7C3AED">Record state</text>
<text x="499.0" y="203" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" fill="#475569">ARN + endpoint into</text>
<text x="499.0" y="216" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" fill="#475569">deployed-state.json</text>
<path d="M 549 179.0 L 555 184.0 L 549 189.0 Z" fill="#64748B"/>
<rect x="556" y="126" width="98" height="116" rx="12" fill="white" stroke="#059669" stroke-width="2" filter="url(#ds)"/>
<circle cx="605.0" cy="152" r="15" fill="url(#g-green)"/>
<text x="605.0" y="157" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="12" font-weight="800" fill="white">6</text>
<text x="605.0" y="184" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#059669">Print endpoint</text>
<text x="605.0" y="203" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" fill="#475569">runtime flips to</text>
<text x="605.0" y="216" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" fill="#475569">READY</text>
<text x="40" y="270" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">Measured wall-clock · first deploy ever in an account: 9 min 49 s</text>
<rect x="40" y="278" width="480" height="26" rx="8" fill="white" stroke="#EA580C" stroke-width="1.5" filter="url(#ds)"/>
<rect x="42" y="280" width="476" height="22" rx="6" fill="url(#g-orange)"/>
<text x="280.0" y="295" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" font-weight="700" fill="white">this deploy: 3 min 29 s (build + synth + stack create)</text>
<rect x="40" y="314" width="480" height="26" rx="8" fill="white" stroke="#059669" stroke-width="1.5" filter="url(#ds)"/>
<rect x="42" y="316" width="198" height="22" rx="6" fill="url(#g-green)"/>
<text x="248" y="331" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#047857">redeploy, code only: 1 min 26 s</text>
<text x="40" y="366" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" fill="#475569">Stack name = <tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="700" fill="#0F172A">AgentCore-&lt;projectName&gt;-&lt;targetName&gt;</tspan> - both values come from the JSON, never hardcoded.</text>
</svg>