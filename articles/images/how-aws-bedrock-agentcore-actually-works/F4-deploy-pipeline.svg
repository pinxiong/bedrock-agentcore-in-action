<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="680">
<rect width="680" height="404" fill="white"/>

<defs>
  <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="2.5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.15"/>
  </filter>
  <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/>
  </linearGradient>
  <linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6D28D9"/>
  </linearGradient>
  <linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF9900"/><stop offset="1" stop-color="#EA580C"/>
  </linearGradient>
  <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#047857"/>
  </linearGradient>
  <linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F43F5E"/><stop offset="1" stop-color="#BE123C"/>
  </linearGradient>
  <linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#0F766E"/>
  </linearGradient>
  <linearGradient id="g-ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#1E3A8A"/>
  </linearGradient>
  <linearGradient id="g-ribbon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2563EB"/><stop offset="0.35" stop-color="#0D9488"/>
    <stop offset="0.65" stop-color="#EA580C"/><stop offset="1" stop-color="#E11D48"/>
  </linearGradient>
</defs>

<rect x="40" y="24" width="129" height="21" rx="10.5" fill="#EA580C"/>
<text x="105" y="38.5" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="white">UNDER THE HOOD</text>
<text x="40" y="80" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="23" font-weight="800" fill="#0F172A">Deploy: Six Steps to READY</text>
<text x="40" y="102" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="12.5" fill="#475569">One command. Zero Dockerfiles. Four CloudFormation resources.</text>
<rect x="26" y="126" width="98" height="116" rx="12" fill="white" stroke="#2563EB" stroke-width="2" filter="url(#ds)"/>
<circle cx="75.0" cy="152" r="15" fill="url(#g-blue)"/>
<text x="75.0" y="157" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="12" font-weight="800" fill="white">1</text>
<text x="75.0" y="184" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#2563EB">Package</text>
<text x="75.0" y="203" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" fill="#475569">zip codeLocation</text>
<text x="75.0" y="216" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" fill="#475569">41 MB asset</text>
