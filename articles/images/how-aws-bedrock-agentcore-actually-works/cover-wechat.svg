<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="653" viewBox="0 0 1536 653">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#0d1c3a"/>
    </linearGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1536" height="653" fill="url(#bg)"/>
  <circle cx="1330" cy="90" r="360" fill="url(#glow1)"/>
  <circle cx="210" cy="600" r="340" fill="url(#glow2)"/>
  <circle cx="760" cy="640" r="300" fill="url(#glow3)"/>

  <!-- kicker capsule -->
  <rect x="96" y="96" width="336" height="52" rx="26" fill="#2563eb" opacity="0.18"/>
  <rect x="96" y="96" width="336" height="52" rx="26" fill="none" stroke="#60a5fa" stroke-opacity="0.55"/>
  <text x="264" y="130" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="3">AWS BEDROCK · 实测</text>

  <!-- main title -->
  <text x="96" y="248" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">AgentCore 上手实测：</text>
  <text x="96" y="336" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">部署 AI Agent 为什么</text>
  <text x="96" y="424" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">不再需要 Dockerfile</text>
  <rect x="100" y="452" width="360" height="6" rx="3" fill="url(#underline)"/>

  <!-- three chips -->
  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="19" font-weight="600">
    <rect x="96" y="512" width="216" height="46" rx="23" fill="#2563eb" opacity="0.16"/>
    <text x="204" y="542" fill="#93c5fd" text-anchor="middle">一个 JSON 文件</text>

    <rect x="336" y="512" width="216" height="46" rx="23" fill="#0d9488" opacity="0.16"/>
    <text x="444" y="542" fill="#5eead4" text-anchor="middle">六条命令</text>

    <rect x="576" y="512" width="216" height="46" rx="23" fill="#7c3aed" opacity="0.16"/>
    <text x="684" y="542" fill="#c4b5fd" text-anchor="middle">一棵 X-Ray trace</text>
  </g>

  <!-- right visual: json file -> cloud resources -->
  <g filter="url(#cardShadow)">
    <rect x="1030" y="120" width="380" height="112" rx="16" fill="#111c38" stroke="#334166"/>
    <text x="1058" y="166" font-family="Menlo, monospace" font-size="24" font-weight="700" fill="#7dd3fc">agentcore.json</text>
    <text x="1058" y="204" font-family="Menlo, monospace" font-size="17" fill="#8ba3c7">entrypoint · build · protocol</text>

    <path d="M1220 252 L1220 300" stroke="#60a5fa" stroke-width="3" stroke-dasharray="7 7"/>
    <path d="M1211 288 L1220 302 L1229 288" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1030" y="316" width="380" height="196" rx="16" fill="#111c38" stroke="#334166"/>
    <text x="1058" y="360" font-family="Menlo, monospace" font-size="20" fill="#93c5fd">AWS::AgentCore::Runtime</text>
    <text x="1058" y="396" font-family="Menlo, monospace" font-size="20" fill="#93c5fd">AWS::IAM::Role</text>
    <text x="1058" y="432" font-family="Menlo, monospace" font-size="20" fill="#93c5fd">AWS::IAM::Policy</text>
    <text x="1058" y="468" font-family="Menlo, monospace" font-size="20" fill="#93c5fd">AWS::CloudFormation::Stack</text>
    <text x="1058" y="498" font-family="Menlo, monospace" font-size="16" fill="#64748b">4 resources · READY in 3m29s</text>
  </g>
</svg>
