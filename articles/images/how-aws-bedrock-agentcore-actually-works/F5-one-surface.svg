<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 496" width="680">
<rect width="680" height="496" fill="white"/>

<defs>
  <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="2.5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.15"/>
  </filter>
  <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/>
  </linearGradient>
  <linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6D28D9"/>
  </linearGradient>
  <linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF9900"/><stop offset="1" stop-color="#EA580C"/>
  </linearGradient>
  <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#047857"/>
  </linearGradient>
  <linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F43F5E"/><stop offset="1" stop-color="#BE123C"/>
  </linearGradient>
  <linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#0F766E"/>
  </linearGradient>
  <linearGradient id="g-ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#1E3A8A"/>
  </linearGradient>
  <linearGradient id="g-ribbon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2563EB"/><stop offset="0.35" stop-color="#0D9488"/>
    <stop offset="0.65" stop-color="#EA580C"/><stop offset="1" stop-color="#E11D48"/>
  </linearGradient>
</defs>

<rect x="40" y="24" width="67" height="21" rx="10.5" fill="#0D9488"/>
<text x="73" y="38.5" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="white">RUN IT</text>
<text x="40" y="80" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="23" font-weight="800" fill="#0F172A">One HTTP Surface, Two Hosts</text>
<text x="40" y="102" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="12.5" fill="#475569">Your code implements two routes. Everything else about hosting is AgentCore's job.</text>
<rect x="140" y="126" width="400" height="64" rx="12" fill="url(#g-ink)" filter="url(#ds)"/>
<text x="340.0" y="154" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="white">GET /ping   |   POST /invocations</text>
<text x="340.0" y="174" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" fill="#93C5FD">the only two routes your code implements</text>
<rect x="40" y="234" width="285" height="190" rx="14" fill="white" stroke="#0D9488" stroke-width="2" filter="url(#ds)"/>
<rect x="40" y="234" width="285" height="44" rx="14" fill="url(#g-teal)"/>
<rect x="40" y="264" width="285" height="14" fill="url(#g-teal)"/>
<text x="56" y="261" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="800" fill="white">agentcore dev</text>
<rect x="278" y="247" width="33" height="18" rx="9" fill="white" opacity="0.25"/>
<text x="295" y="259.5" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1" fill="white">LOCAL</text>
<circle cx="64" cy="296" r="7" fill="#CCFBF1"/>
<path d="M 60.5 296 l 2.5 2.8 l 4.5 -5.5" stroke="#047857" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<text x="80" y="300" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" fill="#475569">Uvicorn on localhost:8080</text>
<circle cx="64" cy="326" r="7" fill="#CCFBF1"/>
<path d="M 60.5 326 l 2.5 2.8 l 4.5 -5.5" stroke="#047857" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<text x="80" y="330" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" fill="#475569">hot reload on file save</text>
<circle cx="64" cy="356" r="7" fill="#CCFBF1"/>
<path d="M 60.5 356 l 2.5 2.8 l 4.5 -5.5" stroke="#047857" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<text x="80" y="360" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" fill="#475569">model calls still go to Bedrock</text>
<circle cx="64" cy="386" r="7" fill="#CCFBF1"/>
<path d="M 60.5 386 l 2.5 2.8 l 4.5 -5.5" stroke="#047857" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<text x="80" y="390" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" fill="#475569">no deployment, no stack</text>
<rect x="355" y="234" width="285" height="190" rx="14" fill="white" stroke="#EA580C" stroke-width="2" filter="url(#ds)"/>
<rect x="355" y="234" width="285" height="44" rx="14" fill="url(#g-orange)"/>
<rect x="355" y="264" width="285" height="14" fill="url(#g-orange)"/>
<text x="371" y="261" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="800" fill="white">agentcore deploy</text>
<rect x="593" y="247" width="33" height="18" rx="9" fill="white" opacity="0.25"/>
<text x="610" y="259.5" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1" fill="white">CLOUD</text>
<circle cx="379" cy="296" r="7" fill="#FFEDD5"/>
<path d="M 375.5 296 l 2.5 2.8 l 4.5 -5.5" stroke="#047857" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<text x="395" y="300" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" fill="#475569">serverless microVM per session</text>
<circle cx="379" cy="326" r="7" fill="#FFEDD5"/>
<path d="M 375.5 326 l 2.5 2.8 l 4.5 -5.5" stroke="#047857" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<text x="395" y="330" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" fill="#475569">https://.../runtimes/&lt;arn&gt;/invocations</text>
<circle cx="379" cy="356" r="7" fill="#FFEDD5"/>
<path d="M 375.5 356 l 2.5 2.8 l 4.5 -5.5" stroke="#047857" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<text x="395" y="360" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" fill="#475569">IAM role + trace pipeline included</text>
<circle cx="379" cy="386" r="7" fill="#FFEDD5"/>
<path d="M 375.5 386 l 2.5 2.8 l 4.5 -5.5" stroke="#047857" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<text x="395" y="390" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10.5" fill="#475569">scaling handled by the platform</text>
<circle cx="340.0" cy="329.0" r="19" fill="url(#g-green)" filter="url(#ds)"/>
<text x="340.0" y="335.0" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="17" font-weight="800" fill="white">=</text>
<text x="340.0" y="226" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="10" font-weight="700" fill="#047857">same code, same routes</text>
<path d="M 333 329.0 L 347 329.0" stroke="#10B981" stroke-width="2" stroke-dasharray="5,4"/>
<text x="340.0" y="448" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="11" font-style="italic" fill="#64748B">No shim, no adapter, no second interface to drift. What passed locally deploys unchanged.</text>
<text x="340.0" y="467" text-anchor="middle" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif" font-size="11" font-style="italic" fill="#64748B">agentcore invoke and boto3 are clients of the hosted surface, not a third interface.</text>
</svg>