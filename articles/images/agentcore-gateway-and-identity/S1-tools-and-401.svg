<text xml:space="preserve" x="44" y="255" font-family="Menlo, monospace" font-size="24" font-weight="600" fill="#5eead4">$ curl -s -X POST $GATEWAY/mcp -H "authorization: Bearer &lt;token&gt;" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}" | jq -r ".result.tool↵</text>
