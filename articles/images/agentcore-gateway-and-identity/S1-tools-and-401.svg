<text xml:space="preserve" x="44" y="144" font-family="Menlo, monospace" font-size="24" font-weight="600" fill="#5eead4">$ curl -s -o /dev/null -w "%{http_code}" -X POST $GATEWAY/mcp -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}"</text>
<text xml:space="preserve" x="44" y="181" font-family="Menlo, monospace" font-size="24" font-weight="400" fill="#dfe7f5">401</text>
