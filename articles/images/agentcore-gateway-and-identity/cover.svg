<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Gateway and Identity: one JWT in, three systems out</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
<radialGradient id="g1" cx="0.06" cy="0.0" r="0.85"><stop offset="0" stop-color="#2563eb" stop-opacity="0.22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.95" cy="1.0" r="0.85"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.20"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect width="1200" height="675" fill="url(#g1)"/>
<rect width="1200" height="675" fill="url(#g2)"/>
<text x="66" y="104" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#60a5fa" font-weight="600">AgentCore in Action</text>
<text x="66" y="196" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="60" fill="#f8fafc" font-weight="700">Gateway and Identity</text>
<text x="66" y="252" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#c4b5fd">One JWT in, three systems out</text>

<rect x="66" y="322" width="252" height="206" rx="14" fill="#0b1428" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
<text x="92" y="362" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#a78bfa" font-weight="600">agent source</text>
<text x="92" y="410" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="17" fill="#e2e8f0">CLIENT_SECRET_ARN</text>
<text x="92" y="446" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#8ea0bd">no system API keys</text>
<text x="92" y="480" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#8ea0bd">no refresh loop</text>

<line x1="330" y1="425" x2="392" y2="425" stroke="#60a5fa" stroke-width="2.4" marker-end="url(#ah)"/>
<text x="361" y="408" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="15" fill="#8ea0bd" text-anchor="middle">token</text>

<rect x="398" y="322" width="248" height="206" rx="14" fill="#0b1428" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
<text x="424" y="362" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#60a5fa" font-weight="600">gateway</text>
<text x="424" y="404" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#e2e8f0">MCP endpoint</text>
<text x="424" y="438" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#e2e8f0">checks the JWT</text>
<text x="424" y="472" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#5eead4">mints outbound</text>

<line x1="654" y1="368" x2="712" y2="368" stroke="#60a5fa" stroke-width="2.4" marker-end="url(#ah)"/>
<line x1="654" y1="425" x2="712" y2="457" stroke="#60a5fa" stroke-width="2.4" marker-end="url(#ah)"/>
<line x1="654" y1="482" x2="712" y2="546" stroke="#60a5fa" stroke-width="2.4" marker-end="url(#ah)"/>

<rect x="720" y="332" width="414" height="72" rx="12" fill="#0b1428" stroke="#059669" stroke-width="2"/>
<text x="746" y="366" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#cbd5e1">orders API</text>
<text x="746" y="392" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#8ea0bd">OpenAPI descriptor</text>
<rect x="720" y="421" width="414" height="72" rx="12" fill="#0b1428" stroke="#ea580c" stroke-width="2"/>
<text x="746" y="455" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#cbd5e1">ticketing function</text>
<text x="746" y="481" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#8ea0bd">Lambda tool schema</text>
<rect x="720" y="510" width="414" height="72" rx="12" fill="#0b1428" stroke="#0d9488" stroke-width="2"/>
<text x="746" y="544" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#cbd5e1">CRM</text>
<text x="746" y="570" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#8ea0bd">remote MCP server</text>

<text x="66" y="628" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#8ea0bd">the agent never holds a credential for any of the three</text>
</svg>
