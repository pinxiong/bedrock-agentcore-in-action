<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" width="1440" height="620" role="img">
<title>The deploy loop: doctor, dev, deploy, invoke, traces, down, with the measured output each one returns.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
<radialGradient id="gA" cx="0.15" cy="0.1" r="0.8"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.22"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1440" height="620" fill="url(#bg)"/>
<rect width="1440" height="620" fill="url(#gA)"/>
