<text x="60" y="66" font-size="17" fill="#ea580c" font-weight="700">THE WHOLE LOOP IN SIX COMMANDS</text>
<text x="60" y="112" font-size="38" fill="#ffffff" font-weight="800">One loop, reproducible</text>
