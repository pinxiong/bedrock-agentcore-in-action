<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 565" width="1440" height="565" role="img">
<title>The span tree of one invoke: two model round trips and one execute_tool span.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
</defs>
<rect width="1440" height="565" fill="url(#bg)"/>
<g font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<text x="60" y="62" font-size="17" fill="#ea580c" font-weight="700">WHAT OBSERVABILITY RECORDED</text>
<text x="60" y="106" font-size="34" fill="#ffffff" font-weight="800">The agent loop, one span per step</text>
<text x="60" y="136" font-size="17" fill="#8ea0bd">trace 6ad45817558974710d8c3b6d35f5a089</text>
<text x="70" y="204" font-size="18.5" fill="#0d9488" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /invocations</text>
<text x="960" y="204" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2574 ms</text>
<text x="1110" y="204" font-size="15" fill="#8ea0bd">the runtime accepts the call</text>
<line x1="88" y1="216" x2="88" y2="240" stroke="#334155" stroke-width="1.6"/>
<line x1="88" y1="238" x2="106" y2="238" stroke="#334155" stroke-width="1.6"/>
<text x="112" y="238" font-size="18.5" fill="#0d9488" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">invoke_agent Strands Agents</text>
<text x="960" y="238" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2428 ms</text>
<text x="1110" y="238" font-size="15" fill="#8ea0bd">tools=[&quot;add_numbers&quot;]  955 in / 81 out</text>
<line x1="130" y1="250" x2="130" y2="274" stroke="#334155" stroke-width="1.6"/>
<line x1="130" y1="272" x2="148" y2="272" stroke="#334155" stroke-width="1.6"/>
<text x="154" y="272" font-size="18.5" fill="#cbd5e1" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">execute_event_loop_cycle  cycle 1</text>
<text x="960" y="272" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1906 ms</text>
<text x="1110" y="272" font-size="15" fill="#8ea0bd">the model asks for the tool</text>
<line x1="172" y1="284" x2="172" y2="308" stroke="#334155" stroke-width="1.6"/>
<line x1="172" y1="306" x2="190" y2="306" stroke="#334155" stroke-width="1.6"/>
<text x="196" y="306" font-size="18.5" fill="#ea580c" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chat  deepseek.v3.2</text>
<text x="960" y="306" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1903 ms</text>
<text x="1110" y="306" font-size="15" fill="#8ea0bd">431 in / 70 out</text>
<line x1="214" y1="318" x2="214" y2="342" stroke="#334155" stroke-width="1.6"/>
<line x1="214" y1="340" x2="232" y2="340" stroke="#334155" stroke-width="1.6"/>
<text x="238" y="340" font-size="18.5" fill="#8ea0bd" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chat deepseek.v3.2  ConverseStream</text>
<text x="960" y="340" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1886 ms</text>
<text x="1110" y="340" font-size="15" fill="#8ea0bd">finish_reason=tool_use</text>
<line x1="130" y1="352" x2="130" y2="376" stroke="#334155" stroke-width="1.6"/>
<line x1="130" y1="374" x2="148" y2="374" stroke="#334155" stroke-width="1.6"/>
<text x="154" y="374" font-size="18.5" fill="#059669" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">execute_tool add_numbers</text>
<text x="960" y="374" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1 ms</text>
<text x="1110" y="374" font-size="15" fill="#8ea0bd">gen_ai.tool.name=add_numbers</text>
<line x1="130" y1="386" x2="130" y2="410" stroke="#334155" stroke-width="1.6"/>
<line x1="130" y1="408" x2="148" y2="408" stroke="#334155" stroke-width="1.6"/>
<text x="154" y="408" font-size="18.5" fill="#cbd5e1" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">execute_event_loop_cycle  cycle 2</text>
<text x="960" y="408" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">520 ms</text>
<text x="1110" y="408" font-size="15" fill="#8ea0bd">the model reads the tool result</text>
<line x1="172" y1="420" x2="172" y2="444" stroke="#334155" stroke-width="1.6"/>
<line x1="172" y1="442" x2="190" y2="442" stroke="#334155" stroke-width="1.6"/>
<text x="196" y="442" font-size="18.5" fill="#ea580c" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chat  deepseek.v3.2</text>
<text x="960" y="442" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">519 ms</text>
<text x="1110" y="442" font-size="15" fill="#8ea0bd">524 in / 11 out</text>
<line x1="214" y1="454" x2="214" y2="478" stroke="#334155" stroke-width="1.6"/>
<line x1="214" y1="476" x2="232" y2="476" stroke="#334155" stroke-width="1.6"/>
<text x="238" y="476" font-size="18.5" fill="#8ea0bd" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chat deepseek.v3.2  ConverseStream</text>
<text x="960" y="476" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">517 ms</text>
<text x="1110" y="476" font-size="15" fill="#8ea0bd">finish_reason=end_turn</text>
<text x="70" y="533" font-size="15" fill="#8ea0bd">spans are asynchronous: this trace was queryable about three minutes after the invoke</text>
</g></svg>
