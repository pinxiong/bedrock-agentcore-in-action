<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520" role="img">
<title>The X-Ray span tree of one invoke: two model round trips and one execute_tool span.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
</defs>
<rect width="1440" height="520" fill="url(#bg)"/>
<g font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<text x="60" y="62" font-size="17" fill="#ea580c" font-weight="700">WHAT OBSERVABILITY RECORDED</text>
<text x="60" y="106" font-size="34" fill="#ffffff" font-weight="800">The agent loop, one span per step</text>
<text x="60" y="136" font-size="17" fill="#8ea0bd">trace 1-6ad4087a-7220c9ed52be46e901c25cc9</text>
<text x="70" y="204" font-size="18.5" fill="#0d9488" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">invoke_agent Strands Agents</text>
<text x="960" y="204" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2.50 s</text>
<text x="1110" y="204" font-size="15" fill="#8ea0bd">tools=[&quot;add_numbers&quot;]  945 in / 71 out</text>
<line x1="88" y1="220" x2="88" y2="244" stroke="#334155" stroke-width="1.6"/>
<line x1="88" y1="242" x2="106" y2="242" stroke="#334155" stroke-width="1.6"/>
<text x="112" y="242" font-size="18.5" fill="#cbd5e1" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">execute_event_loop_cycle  cycle 1</text>
<text x="960" y="242" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0.68 s</text>
<text x="1110" y="242" font-size="15" fill="#8ea0bd">the model asks for the tool</text>
<line x1="130" y1="258" x2="130" y2="282" stroke="#334155" stroke-width="1.6"/>
<line x1="130" y1="280" x2="148" y2="280" stroke="#334155" stroke-width="1.6"/>
<text x="154" y="280" font-size="18.5" fill="#ea580c" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chat  deepseek.v3.2</text>
<text x="960" y="280" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0.68 s</text>
<text x="1110" y="280" font-size="15" fill="#8ea0bd">431 in / 60 out</text>
<line x1="172" y1="296" x2="172" y2="320" stroke="#334155" stroke-width="1.6"/>
<line x1="172" y1="318" x2="190" y2="318" stroke="#334155" stroke-width="1.6"/>
<text x="196" y="318" font-size="18.5" fill="#8ea0bd" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">BedrockRuntime  ConverseStream</text>
<text x="960" y="318" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0.67 s</text>
<text x="1110" y="318" font-size="15" fill="#8ea0bd">finish_reason=tool_use</text>
<line x1="88" y1="334" x2="88" y2="358" stroke="#334155" stroke-width="1.6"/>
<line x1="88" y1="356" x2="106" y2="356" stroke="#334155" stroke-width="1.6"/>
<text x="112" y="356" font-size="18.5" fill="#cbd5e1" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">execute_event_loop_cycle  cycle 2</text>
<text x="960" y="356" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1.82 s</text>
<text x="1110" y="356" font-size="15" fill="#8ea0bd">the model reads the tool result</text>
<line x1="130" y1="372" x2="130" y2="396" stroke="#334155" stroke-width="1.6"/>
<line x1="130" y1="394" x2="148" y2="394" stroke="#334155" stroke-width="1.6"/>
<text x="154" y="394" font-size="18.5" fill="#ea580c" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chat  deepseek.v3.2</text>
<text x="960" y="394" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1.82 s</text>
<text x="1110" y="394" font-size="15" fill="#8ea0bd">514 in / 11 out</text>
<line x1="172" y1="410" x2="172" y2="434" stroke="#334155" stroke-width="1.6"/>
<line x1="172" y1="432" x2="190" y2="432" stroke="#334155" stroke-width="1.6"/>
<text x="196" y="432" font-size="18.5" fill="#8ea0bd" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">BedrockRuntime  ConverseStream</text>
<text x="960" y="432" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1.80 s</text>
<text x="1110" y="432" font-size="15" fill="#8ea0bd">finish_reason=end_turn</text>
<line x1="130" y1="448" x2="130" y2="472" stroke="#334155" stroke-width="1.6"/>
<line x1="130" y1="470" x2="148" y2="470" stroke="#334155" stroke-width="1.6"/>
<text x="154" y="470" font-size="18.5" fill="#059669" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">execute_tool add_numbers</text>
<text x="960" y="470" font-size="17" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">success</text>
<text x="1110" y="470" font-size="15" fill="#8ea0bd">gen_ai.tool.name=add_numbers</text>
<text x="70" y="488" font-size="15" fill="#8ea0bd">spans are asynchronous: they took about two minutes to become queryable in this account</text>
</g></svg>
