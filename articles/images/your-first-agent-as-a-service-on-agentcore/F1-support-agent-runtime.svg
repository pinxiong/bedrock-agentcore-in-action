<text x="108" y="800" font-size="15" fill="#8ea0bd" font-weight="400" text-anchor="start" font-family="inherit">deploy, cold stack</text>
<text x="480" y="800" font-size="15" fill="#ffffff" font-weight="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1 m 31 s</text>
<circle cx="94" cy="817" r="3.5" fill="#ea580c"/>
<text x="108" y="822" font-size="15" fill="#8ea0bd" font-weight="400" text-anchor="start" font-family="inherit">invoke, cold session</text>
<text x="480" y="822" font-size="15" fill="#ffffff" font-weight="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">9 954 ms</text>
<circle cx="94" cy="839" r="3.5" fill="#ea580c"/>
<text x="108" y="844" font-size="15" fill="#8ea0bd" font-weight="400" text-anchor="start" font-family="inherit">invoke_agent span</text>
<text x="480" y="844" font-size="15" fill="#ffffff" font-weight="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2.43 s</text>
<circle cx="94" cy="861" r="3.5" fill="#ea580c"/>
<text x="108" y="866" font-size="15" fill="#8ea0bd" font-weight="400" text-anchor="start" font-family="inherit">tokens per invoke</text>
<text x="480" y="866" font-size="15" fill="#ffffff" font-weight="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">955 in / 81 out</text>
<circle cx="94" cy="883" r="3.5" fill="#ea580c"/>
<text x="108" y="888" font-size="15" fill="#8ea0bd" font-weight="400" text-anchor="start" font-family="inherit">model cost per invoke</text>
<text x="480" y="888" font-size="15" fill="#ffffff" font-weight="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0.00074</text>
