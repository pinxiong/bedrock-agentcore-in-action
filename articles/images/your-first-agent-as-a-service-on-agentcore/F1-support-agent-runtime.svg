<text x="1130" y="820" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start" font-family="inherit">no task definition</text>
<circle cx="1118" cy="837" r="3.5" fill="#e11d48"/>
<text x="1130" y="842" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start" font-family="inherit">no load balancer</text>
<circle cx="1118" cy="859" r="3.5" fill="#e11d48"/>
<text x="1130" y="864" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start" font-family="inherit">no IAM policy document</text>
<circle cx="1118" cy="881" r="3.5" fill="#e11d48"/>
<text x="1130" y="886" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start" font-family="inherit">no OTEL exporter config</text>
