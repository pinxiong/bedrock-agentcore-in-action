<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 726" width="1440" height="726" role="img">
<title>A preference stated in session one is extracted into a record and read back by session two, which never saw the first conversation.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0d1c3a"/></linearGradient>
<radialGradient id="g1" cx="0.08" cy="0.02" r="0.8"><stop offset="0" stop-color="#0d9488" stop-opacity="0.22"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.92" cy="1.0" r="0.8"><stop offset="0" stop-color="#ea580c" stop-opacity="0.20"/><stop offset="1" stop-color="#ea580c" stop-opacity="0"/></radialGradient>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker>
</defs>
<rect width="1440" height="726" fill="url(#bg)"/>
<rect width="1440" height="726" fill="url(#g1)"/>
<rect width="1440" height="726" fill="url(#g2)"/>
<text x="60" y="62" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#f8fafc" text-anchor="start" font-weight="600">the cross-session loop, measured</text>
<text x="60" y="90" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400">actor store_manager_south, two invocations of the same runtime, two session ids</text>
<rect x="60" y="130" width="560" height="300" rx="18" fill="#0b1428" stroke="#2563eb" stroke-width="2"/>
<text x="88" y="172" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#93c5fd" text-anchor="start" font-weight="600">session one  06:25:46Z</text>
<text x="88" y="206" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="start" font-weight="400">prompt  &quot;From now on, only reorder for the</text>
<text x="88" y="230" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="start" font-weight="400">        South China region. Ignore every other</text>
<text x="88" y="254" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="start" font-weight="400">        region.&quot;</text>
<text x="88" y="296" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#64748b" text-anchor="start" font-weight="400">the agent stores nothing itself.</text>
<text x="88" y="322" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#64748b" text-anchor="start" font-weight="400">it appends both turns as one event;</text>
<text x="88" y="348" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#64748b" text-anchor="start" font-weight="400">extraction decides what becomes a record.</text>
<text x="88" y="404" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#5eead4" text-anchor="start" font-weight="400">returned 06:26:03Z   17 s of CLI wall clock</text>
<line x1="624" y1="280" x2="700" y2="280" stroke="#5eead4" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="700" y="180" width="300" height="200" rx="18" fill="#101c37" stroke="#ea580c" stroke-width="2"/>
<text x="850" y="226" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#fdba74" text-anchor="middle" font-weight="600">extraction</text>
<text x="850" y="262" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8ea0bd" text-anchor="middle" font-weight="400">runs after the event,</text>
<text x="850" y="292" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8ea0bd" text-anchor="middle" font-weight="400">not inside the invoke</text>
<text x="850" y="336" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">255 s to become readable</text>
<text x="850" y="362" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400">measured, not estimated</text>
<line x1="1004" y1="280" x2="1080" y2="280" stroke="#fdba74" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="1080" y="130" width="300" height="300" rx="18" fill="#0b1428" stroke="#059669" stroke-width="2"/>
<text x="1230" y="172" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#6ee7b7" text-anchor="middle" font-weight="600">session two  06:30:18Z</text>
<text x="1230" y="204" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7c93b5" text-anchor="middle" font-weight="400">a session id it has never seen</text>
<text x="1230" y="246" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8ea0bd" text-anchor="middle" font-weight="400">prompt</text>
<text x="1230" y="272" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle" font-weight="400">&quot;Draft this week&#x27;s</text>
<text x="1230" y="296" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle" font-weight="400">reorder list.&quot;</text>
<text x="1230" y="340" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8ea0bd" text-anchor="middle" font-weight="400">reordered for</text>
<text x="1230" y="368" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">South China only</text>
<text x="1230" y="404" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#5eead4" text-anchor="middle" font-weight="400">Guangzhou, Shenzhen, Dongguan</text>
<rect x="60" y="462" width="1320" height="116" rx="16" fill="#0b1428" stroke="#1e2a44" stroke-width="1.5"/>
<text x="88" y="502" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#f8fafc" text-anchor="start" font-weight="600">why this is not the default answering</text>
<text x="88" y="534" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#34d399" text-anchor="start" font-weight="400">namespace  /users/store_manager_south/preferences</text>
<text x="88" y="562" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="start" font-weight="400">the system prompt picks North China when no preference is remembered, and the</text>
<text x="88" y="586" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="start" font-weight="400">agent has to say it is guessing; this session did neither.</text>
<rect x="60" y="588" width="1320" height="104" rx="16" fill="#0b1428" stroke="#1e2a44" stroke-width="1.5"/>
<text x="88" y="636" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#34d399" text-anchor="start" font-weight="400">east    /users/store_manager_east/preferences    East China   Shanghai, Hangzhou, Nanjing</text>
<text x="88" y="668" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#fdba74" text-anchor="start" font-weight="400">south   /users/store_manager_south/preferences   South China  Guangzhou, Shenzhen, Dongguan</text>
<text x="60" y="710" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">the two lines above are two invocations fourteen seconds apart, same prompt, two actor ids.</text>
</svg>
