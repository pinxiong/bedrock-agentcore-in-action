<text x="58" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17.5" fill="#cbd5e1" xml:space="preserve">$ agentcore invoke --user-id store_manager_east --session-id 597e436a5ae1435cb7d6c422c4a936be-584aa045 \</text>
