[project]
name = "07-multi-agent-registry"
version = "0.1.0"
description = "Multi Agent Registry: use case 07 of bedrock-agentcore-in-action"
requires-python = ">=3.10"   # CodeZip runtime targets go up to PYTHON_3_14
dependencies = [
    # A2A protocol, both sides: the specialists serve it, the orchestrator speaks it
    "a2a-sdk[all] >= 0.3.0, < 0.4.0",
    # AG-UI protocol for the orchestrator endpoint
    "ag-ui-protocol >= 0.1.10",
    # 1.25.0 stopped pulling the ADOT distro; without it the runtime emits no spans
    "aws-opentelemetry-distro >= 0.18.0",
    # serve_a2a needs the a2a extra, AGUIApp needs ag-ui
    "bedrock-agentcore[a2a,ag-ui,strands-agents] >= 1.18.1",
    "botocore[crt] >= 1.35.0",
    # SigV4-signed JSON-RPC to the specialist runtimes
    "httpx >= 0.28",
    # the billing MCP server
    "mcp >= 1.28.1, < 2.0.0",
    "strands-agents >= 1.13.0",
    "uvicorn >= 0.34.3",
]

[project.optional-dependencies]
test = ["boto3", "pytest"]

[tool.uv]
package = false
